  --safe-area-inset-left: env(safe-area-inset-left, 0px);

  :root{
    --ground:#131b29;
    --panel:#223049;
  }

*{
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
}

html,body,#root{
  height:100%;
  margin:0;
}

body{
  background:var(--ground);
  color:var(--text);
  font-family:'Tajawal',system-ui,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
}

button{
  font-family:inherit;
}

.font-display{
  font-family:'Changa',system-ui,sans-serif;
}

.pixel{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

.no-select{
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.press{
  transition:transform .08s ease, box-shadow .08s ease, background .08s ease, filter .08s ease;
}

.press:active, .press.is-on{
  transform:scale(.92);
  filter:brightness(1.15);
}

.attack-ready{
  animation:attackPulse 1.1s ease-in-out infinite;
  box-shadow:0 6px 0 var(--gold-dk), 0 0 0 5px rgba(242,184,75,.22), 0 0 26px rgba(242,184,75,.55);
}

@keyframes attackPulse{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }
}

.float-y{
  animation:floatY 2.4s ease-in-out infinite;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translate(-50%,8px);
  }

  to{
    opacity:1;
    transform:translate(-50%,0);
  }
}

.toast-in{
  animation:toastIn .18s ease-out;
}

@keyframes sheetIn{
  from{
    transform:translateY(28px);
    opacity:.4;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }
}

.sheet-in{
  animation:sheetIn .22s ease-out;
}

@keyframes fadeIn{
  from{
    opacity:0
  }

  to{
    opacity:1
  }
}

.fade-in{
  animation:fadeIn .2s ease-out;
}

.gold-shadow{
  box-shadow:0 5px 0 var(--gold-dk);
}

.gold-shadow:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 var(--gold-dk);
}

/* Rotate overlay is driven ONLY by JavaScript (window.innerWidth vs
   window.innerHeight). No CSS orientation media query may show it, because
   those queries are unreliable inside iframes / some browsers. */

.rotate-overlay{
  display:none;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.rotate-overlay.show-rotate{
  display:flex;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

/* MISSIONS — hidden panel must never block joystick / attack */

#missionsPanel[hidden]{
  display:none !important;
  pointer-events:none !important;
}

#missionsPanel .mission-item.done{
  color:var(--gold);
}

#missionsPanel .mission-item.done #mission1Status,
#missionsPanel .mission-item.done #mission2Status,
#missionsPanel .mission-item.done #mission3Status{
  color:#ffe08a;
}

/* FORCED LANDSCAPE — #game-root holds the whole game (canvas, HUD,
   D-pad, attack, start screen). In portrait + forced mode the whole
   frame is rotated 90deg, so the game physically appears horizontal.
   In true landscape the frame has no transform. The rotate overlay
   lives outside #game-root, so it stays readable in portrait. */

#game-root{
  width:100dvw;
  height:100dvh;
}

body.force-landscape #game-root{
  width:100dvw;
  height:100dvh;
}

body.force-landscape-portrait #game-root{
  position:fixed;
  top:50%;
  left:50%;
  width:100dvh;
  height:100dvw;
  transform:translate(-50%, -50%) rotate(90deg);
  transform-origin:center center;
  overflow:hidden;
}

#game-root .game-canvas{
  width:100%;
  height:100%;
  -o-object-fit:contain;
     object-fit:contain;
}

@keyframes rotatePhone{
  0%,18%{
    transform:rotate(0deg);
  }

  42%,72%{
    transform:rotate(90deg);
  }

  92%,100%{
    transform:rotate(90deg);
  }
}

.rotate-phone{
  animation:rotatePhone 2.2s ease-in-out infinite;
  transform-origin:center;
}

@keyframes rotateDot{
  0%,40%{
    opacity:.25;
    transform:translateX(0);
  }

  55%{
    opacity:1;
    transform:translateX(-10px);
  }

  75%,100%{
    opacity:.25;
    transform:translateX(-18px);
  }
}

.rotate-dot{
  animation:rotateDot 2.2s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce){
  .rotate-phone,.rotate-dot{
    animation:none;
  }
}

/* Landscape start screen: keep the two character cards side-by-side and
   keep the whole start panel inside a short landscape viewport. */

@media (orientation: landscape) and (max-height: 520px){

    padding-bottom:10px !important;
    gap:8px !important;

  .start-title{
    font-size:34px !important;
    line-height:1 !important;
  }

  .start-preview{
    height:64px !important;
    width:64px !important;
  }
}

    width: 38%;

    max-width: none;

  .landscape\:shrink-0{

    gap: 1.5rem;
  }

<script>
// ===== موسيقى تلقائية - بلا زر =====
(function(){
  var ctx=null, timer=null, step=0, started=false;
  var melody=[523,659,784,659, 523,659,784,880, 784,659,523,659, 440,523,659,784];
  var bass=[131,131,175,175, 131,131,175,196, 175,131,131,131, 110,131,175,196];
  function ensureCtx(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state==='suspended'){ ctx.resume(); }
    return ctx;
  }
  function playNote(freq, dur, type, vol, when){
    if(!ctx) return;
    try{
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type=type||'triangle'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.08, when);
      g.gain.exponentialRampToValueAtTime(0.001, when+dur);
      o.start(when); o.stop(when+dur+0.02);
    }catch(e){}
  }
  function tick(){
    if(!ctx) return;
    var now=ctx.currentTime;
    var m=melody[step % melody.length];
    var b=bass[step % bass.length];
    playNote(m, 0.22, 'triangle', 0.07, now);
    playNote(b, 0.22, 'sine', 0.05, now);
    step++;
  }
  function startMusic(){
    if(started) return;
    if(!ensureCtx()) return;
    started=true;
    if(timer) return;
    timer=setInterval(tick, 240);
  }
  document.addEventListener('pointerdown', startMusic);
  document.addEventListener('keydown', startMusic);
  document.addEventListener('touchstart', startMusic);
  try{ startMusic(); }catch(e){}
})();
</script>
